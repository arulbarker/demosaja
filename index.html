let state=load();
function load(){try{const r=localStorage.getItem('sgd');return r?Object.assign(makeSeed(),JSON.parse(r)):makeSeed();}catch(e){return makeSeed();}}
function save(){try{localStorage.setItem('sgd',JSON.stringify(state));}catch(e){}}
function setState(patch){state=Object.assign(state,typeof patch==='function'?patch(state):patch);save();render();}
function resetDemo(){localStorage.removeItem('sgd');state=makeSeed();render();toast('Demo direset ke data awal');}
function setPath(path,v){const p=path.split('.');if(p.length===1)state[p[0]]=v;else state[p[0]][p[1]]=v;save();}

const TOP=['home','items','scan','trx','wa'];
const TITLES={home:['Stok Gudang','Gudang Utama'],items:['Barang','Master data'],item:['Detail barang','Master data'],add:['Tambah barang','Master data'],scan:['Scan barcode','Masuk / keluar cepat'],trx:['Transaksi','Mutasi stok'],trxForm:['Transaksi baru','Mutasi stok'],opname:['Stock opname','Hitung fisik'],wa:['WhatsApp','Notifikasi & pesan'],templates:['Template pesan','WhatsApp'],more:['Lainnya','Akun & pengaturan'],users:['Pengguna & peran','Hak akses'],log:['Log aktivitas','Audit trail'],export:['Export laporan','Excel / PDF']};
function go(s,extra){state=Object.assign(state,{screen:s,prev:TOP.includes(s)?[]:state.prev.concat([state.screen]).slice(-6)},extra||{});save();render();}
function goBack(){const p=state.prev.slice();const s=p.pop()||'home';setState({screen:s,prev:p});}
function curUser(){return state.users.find(u=>u.id===state.userId)||state.users[0];}
function firstName(){return curUser().name.split(' ')[0];}
function addLog(action,user){state.log=[{at:Date.now(),user:user||firstName(),action:action}].concat(state.log);save();}

function convPcs(it,qty,unitName){const u=it.units.find(x=>x.n===unitName)||it.units[0];return qty*u.f;}
function stockValue(items){return items.reduce((a,i)=>a+i.stock*i.buy,0);}
function totalUnits(items){return items.reduce((a,i)=>a+i.stock,0);}
function validTrx(it,type,pcs){if(!pcs||pcs<=0)return 'Jumlah harus lebih dari 0.';if(type==='keluar'&&pcs>it.stock)return 'Stok tidak cukup (tersedia '+it.stock+' pcs).';return null;}
function breakdown(it){let r=it.stock;const parts=[];it.units.slice().sort((a,b)=>b.f-a.f).forEach(u=>{const n=Math.floor(r/u.f);if(n>0||u.f===1){parts.push(n+' '+u.n);r-=n*u.f;}});return parts.join(' · ');}
function lowItems(){return state.items.filter(i=>i.stock<=i.min).sort((a,b)=>(a.stock/(a.min||1))-(b.stock/(b.min||1)));}
function itemById(id){return state.items.find(i=>i.id===Number(id));}
function nextRef(){const ref='TRX-'+String(state.seq).padStart(4,'0');state.seq++;return ref;}

 results.push(['validasi keluar melebihi stok ditolak',validTrx(it,'keluar',101)!==null]);
 results.push(['validasi keluar pas stok diterima',validTrx(it,'keluar',100)===null]);
 results.push(['nilai stok',stockValue([{stock:2,buy:1500},{stock:3,buy:1000}])===6000]);
 results.push(['total unit',totalUnits([{stock:2},{stock:3}])===5]);
 results.push(['status habis',stat({stock:0,min:40})[0]==='Habis']);
 results.push(['status kritis',stat({stock:20,min:40})[0]==='Kritis']);
 results.push(['status menipis',stat({stock:40,min:40})[0]==='Menipis']);
 results.push(['status aman',stat({stock:41,min:40})[0]==='Aman']);
 results.push(['breakdown 26 pcs (dus 6, karton 12)',breakdown({stock:26,units:U(6,12)})==='2 karton · 2 pcs']);
 const pass=results.filter(r=>r[1]).length;
 results.forEach(r=>console.log((r[1]?'PASS':'FAIL')+' — '+r[0]));
 console.log('TESTS: '+pass+'/'+results.length+(pass===results.length?' ✅':' ❌'));
 return pass===results.length;
}

function submitTrx(){
 const F=state.form;const it=itemById(F.itemId);const qty=Number(F.qty);
 if(!it)return;
 const pcs=convPcs(it,qty,F.unit);
 const err=validTrx(it,F.type,pcs);
 if(err)return setState({formError:err});
 const sign=F.type==='keluar'?-1:1;
 const oldStock=it.stock;const newStock=it.stock+sign*pcs;
 const ref=nextRef();
 const note=F.type==='keluar'?(F.customer||F.note||'-'):(F.note||'-');
 state.items=state.items.map(i=>i.id===it.id?Object.assign({},i,{stock:newStock}):i);
 state.trx=[{id:ref,type:F.type,itemId:it.id,qty:qty,unit:F.unit,pcs:sign*pcs,at:Date.now(),by:firstName(),note:note}].concat(state.trx);
 addLog('mencatat '+F.type+' '+qty+' '+F.unit+' '+it.name+' ('+ref+')');
 const notifyShip=F.type==='keluar'&&F.notify&&F.phone;
 const shipData={pelanggan:F.customer||'Pelanggan',ref:ref,qty:qty,satuan:F.unit,nama:it.name};
 const shipPhone=F.phone,shipTo=F.customer||F.phone;
 state.form=Object.assign({},F,{qty:'',note:'',customer:'',phone:''});state.formError='';
 save();
 if(notifyShip){sendWA(shipPhone,fill(state.tpl.ship.text,shipData),'Konfirmasi kirim '+ref,shipTo);}
 else{toast(ref+' tersimpan. Stok '+it.name+': '+newStock+' pcs');}
 if(state.wa.autoLow&&newStock<=it.min&&oldStock>it.min){const itNew=Object.assign({},it,{stock:newStock});setTimeout(function(){lowFor(itNew);},400);}
 go('trx',{curId:it.id});
}
function submitAdd(){
 const a=state.add;
 if(!a.name.trim())return setState({addError:'Nama barang wajib diisi.'});
 const id=Math.max.apply(null,state.items.map(i=>i.id))+1;
 const it={id:id,sku:a.sku||'SKU-'+String(id).padStart(4,'0'),barcode:a.barcode||'-',name:a.name.trim(),cat:a.cat,stock:Number(a.stock)||0,min:Number(a.min)||0,buy:Number(a.buy)||0,sell:Number(a.sell)||0,units:U(Number(a.dus)||1,Number(a.karton)||1),supplier:a.supplier||'-',phone:a.phone||'',rak:a.rak||'-'};
 state.items=state.items.concat([it]);
 state.add=Object.assign({},a,{name:'',sku:'',barcode:'',stock:'',min:'',buy:'',sell:'',supplier:'',phone:'',rak:''});state.addError='';
 addLog('menambah barang baru '+it.name+' ('+it.sku+')');
 save();toast('Barang '+it.name+' ditambahkan');go('item',{curId:id});
}
function submitOpname(){
 const changes=state.items.filter(i=>state.opn[i.id]!==undefined&&state.opn[i.id]!==''&&Number(state.opn[i.id])!==i.stock);
 if(!changes.length)return toast('Tidak ada selisih. Stok sesuai.');
 const by=firstName();
 const trx=changes.map(i=>({id:nextRef(),type:'opname',itemId:i.id,qty:Math.abs(Number(state.opn[i.id])-i.stock),unit:'pcs',pcs:Number(state.opn[i.id])-i.stock,at:Date.now(),by:by,note:'Penyesuaian opname'}));
 state.items=state.items.map(i=>changes.find(c=>c.id===i.id)?Object.assign({},i,{stock:Number(state.opn[i.id])}):i);
 state.trx=trx.concat(state.trx);state.opn={};
 addLog('menyelesaikan stock opname, '+changes.length+' item disesuaikan');
 save();toast('Opname tersimpan: '+changes.length+' penyesuaian');go('trx');
}
function exportRows(){

 if(E.report==='mutasi')return [['Ref','Tipe','Barang','Qty','Satuan','Pcs','Tanggal','Oleh','Catatan']].concat(state.trx.map(t=>[t.id,t.type,nm(t.itemId),t.qty,t.unit,t.pcs,fD(t.at)+' '+fT(t.at),t.by,t.note]));
 if(E.report==='log')return [['Tanggal','Jam','Pengguna','Aktivitas']].concat(state.log.map(l=>[fD(l.at),fT(l.at),l.user,l.action]));
 const src=E.report==='menipis'?state.items.filter(i=>i.stock<=i.min):state.items;
 return [['SKU','Barcode','Nama','Kategori','Rak','Stok (pcs)','Min','Status','Harga beli','Nilai stok','Supplier']].concat(src.map(i=>[i.sku,i.barcode,i.name,i.cat,i.rak,i.stock,i.min,stat(i)[0],i.buy,i.stock*i.buy,i.supplier]));
}
function doExport(){

  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';a.click();
 }else{
  const w=window.open('','_blank');if(!w)return toast('Popup diblokir browser');
  const table=rows.map((r,i)=>'<tr>'+r.map(c=>(i?'<td>':'<th>')+String(c).replace(/</g,'&lt;')+(i?'</td>':'</th>')).join('')+'</tr>').join('');
  const SC='scr'+'ipt';

  w.document.close();
 }
 addLog('mengexport laporan '+state.exp.report+' ('+state.exp.fmt.toUpperCase()+')');
 save();render();toast('Laporan '+state.exp.fmt.toUpperCase()+' disiapkan');
}

 setTrxTab:function(t){setState({trxTab:t});},
 scanIt:function(id){const it=itemById(id);if(it){go('item',{curId:it.id});toast('Terbaca: '+it.barcode+' → '+it.name);}},
 lookupCode:function(){const c=state.scanCode.trim();const it=state.items.find(i=>i.barcode===c||i.sku.toLowerCase()===c.toLowerCase());if(it){go('item',{curId:it.id});toast('Terbaca: '+it.barcode+' → '+it.name);}else toast('Barcode tidak ditemukan');},
 waToggle:function(k){setState(s=>{const w=Object.assign({},s.wa);w[k]=!w[k];return {wa:w};});},
 sendDaily:function(){sendWA(state.wa.admin,reportText(),'Laporan harian','Admin '+state.wa.admin);},
 sendLowAll:function(){const low=lowItems();if(!low.length)return toast('Tidak ada stok menipis');sendWA(state.wa.admin,'*Stok menipis* '+fD(Date.now())+'\n'+low.map(i=>'• '+i.name+' — '+i.stock+'/'+i.min+' pcs ('+stat(i)[0]+')').join('\n')+'\n— Gudang Utama','Daftar stok menipis','Admin '+state.wa.admin);},
 sendReportWa:function(){sendWA(state.wa.admin,reportText(),'Ringkasan laporan','Admin '+state.wa.admin);},
 saveTpl:function(){addLog('memperbarui template pesan WhatsApp');save();toast('Template tersimpan');goBack();},
 userToggle:function(id){setState(s=>({users:s.users.map(u=>u.id===Number(id)?Object.assign({},u,{active:!u.active}):u)}));},
 expFmt:function(f){setState(s=>({exp:Object.assign({},s.exp,{fmt:f})}));},
 doExport:function(){doExport();}
};

document.addEventListener('click',function(e){
 const t=e.target.closest('[data-act]');if(!t)return;
 const act=t.getAttribute('data-act');const arg=t.getAttribute('data-arg');
 if(ACTIONS[act])ACTIONS[act](arg);
});
document.addEventListener('input',function(e){
 const el=e.target;
 if(el.dataset.bind){
  setPath(el.dataset.bind,el.value);
  if(el.dataset.bind==='q'){
   const f=itemsFiltered();
   const c=document.getElementById('itemsCount');if(c)c.textContent=f.length+' barang';
   const l=document.getElementById('itemsList');if(l)l.innerHTML=f.map(ItemRow).join('');
  }
  if(el.dataset.bind==='form.qty'){const fc=document.getElementById('formCalc');if(fc)fc.innerHTML=formCalcHtml();}
  return;
 }
 if(el.dataset.opn){
  const id=Number(el.dataset.opn);state.opn[id]=el.value;save();
  const it=itemById(id);const sp=document.getElementById('opnDiff-'+id);
  if(it&&sp){const d=el.value===''?0:Number(el.value)-it.stock;sp.textContent=(d>0?'+':'')+d;sp.style.color=d===0?'#6F8AA6':d>0?'#2E9E6B':'#D9453B';}
  return;
 }
 if(el.dataset.tpl){state.tpl[el.dataset.tpl].text=el.value;save();}
});
document.addEventListener('change',function(e){
 const el=e.target;
 if(el.dataset.sel){
  let v=el.value;
  if(el.dataset.sel==='userId'){setState({userId:Number(v)});toast('Masuk sebagai '+curUser().name);return;}
  if(el.dataset.sel==='form.itemId'){setState(s=>({form:Object.assign({},s.form,{itemId:Number(v),unit:'pcs'})}));return;}
  setPath(el.dataset.sel,v);render();
 }
});
document.addEventListener('keydown',function(e){
 if(e.target.id==='scanInp'&&e.key==='Enter')ACTIONS.lookupCode();
});
document.getElementById('reset').addEventListener('click',resetDemo);

function init(){if(location.search.indexOf('test')>-1)runTests();render();}
init();
</script>
</body>
</html>
